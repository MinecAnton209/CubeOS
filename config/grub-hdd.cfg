set timeout=3
set default=0

menuentry "CubeOS v1.0" {
    insmod part_msdos
    insmod fat
    set root=(hd0,msdos2)
    multiboot2 /system/kernel/cubecore_1-0-0-dev.elf
}

menuentry "CubeOS v1.0 (Debug)" {
    insmod part_msdos
    insmod fat
    set root=(hd0,msdos2)
    multiboot2 /system/kernel/cubecore_1-0-0-dev.elf debug
}
