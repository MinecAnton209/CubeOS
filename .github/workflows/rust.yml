name: CubeOS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # 1. Системные зависимости: сборка ядра, ISO (xorriso, grub) и HDD без root (mtools, util-linux)
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y nasm gcc build-essential xorriso mtools grub-pc-bin grub-common

    # 2. Устанавливаем Rust nightly
    - name: Install Rust nightly
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: rust-src, llvm-tools-preview

    # 3. Ядро и csh
    - name: Build kernel and shell
      run: make all

    # 4. ISO (проверяет GRUB и xorriso)
    - name: Build ISO
      run: make iso

    # 5. HDD-образ
    - name: Build HDD image
      run: make hdd

    # 6. Host-тесты
    - name: Run host tests
      run: make test

    # 7. Сохраняем собранные артефакты (чтобы их можно было скачать)
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: CubeOS-Builds
        path: |
          kernel.elf
          cubeos.iso
          cubeos.img
        if-no-files-found: warn
